<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="h3 mb-3">Orders</h1>
  <form id="new-order" class="row g-2 mb-4">
    <div class="col-auto"><input class="form-control" name="customer" placeholder="Customer" required></div>
    <div class="col-auto"><input class="form-control" name="total" type="number" min="0" step="0.01" placeholder="Total" required></div>
    <div class="col-auto"><button class="btn btn-primary">Add order</button></div>
  </form>
  <table class="table table-striped">
    <thead><tr><th>#</th><th>Customer</th><th>Total</th><th>Status</th><th>Created</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
  const money = (cents) => (cents / 100).toLocaleString(undefined, { style: "currency", currency: "USD" });
  async function load() {
    const res = await fetch("/orders");
    const orders = await res.json();
    document.getElementById("rows").innerHTML = orders.map((o) =>
      `<tr><td>${o.id}</td><td>${o.customer}</td><td>${money(o.total_cents)}</td><td><span class="badge text-bg-secondary">${o.status}</span></td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`
    ).join("");
  }
  document.getElementById("new-order").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await fetch("/orders", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer: f.get("customer"), total_cents: Math.round(Number(f.get("total")) * 100) }) });
    e.target.reset();
    load();
  });
  load();
</script>
</body>
</html>
